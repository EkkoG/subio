[Proxy]
Office WG = wireguard, section-name=office-wg
My Tailnet = tailscale, section-name=my-tailnet
On = direct, interface=en0
Off = reject

[WireGuard office-wg]
private-key = client-private-key
self-ip = 10.20.0.2
mtu = 1280
peer = (public-key = server-public-key, allowed-ips = 10.20.0.0/24, endpoint = vpn.example.com:51820)

[Tailscale my-tailnet]
auth-key = tskey-auth-example
hostname = surge-client
