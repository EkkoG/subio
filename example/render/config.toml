[[provider]]
name = "yaml-nodes"
type = "mihomo"
file = "nodes.yaml"
parameterized = true

[[provider]]
name = "native-nodes"
type = "subio"
file = "nodes.toml"
parameterized = true

[[artifact]]
name = "yaml-client.yaml"
type = "mihomo"
providers = ["yaml-nodes"]
template = "client.yaml"
[artifact.params.name]
default = "example"
[artifact.params.host]
default = "proxy.example.test"
[artifact.params.port]
type = "integer"
default = 1080
min = 1
max = 65535
[artifact.params.udp]
type = "boolean"
default = true
[artifact.params.controller_secret]
default = ""
allow_empty = true

[[artifact]]
name = "native-client.yaml"
type = "mihomo"
providers = ["native-nodes"]
template = "client.yaml"
[artifact.params.name]
default = "example"
[artifact.params.host]
default = "proxy.example.test"
[artifact.params.port]
type = "integer"
default = 1080
min = 1
max = 65535
[artifact.params.udp]
type = "boolean"
default = true
[artifact.params.controller_secret]
default = ""
allow_empty = true
