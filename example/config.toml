log_level = "INFO"

[options]
work = true
proxy_test_url = "https://connectivity-check.example.test/generate_204"

[filters]
exclude = "^disabled-"

[[provider]]
name = "portable"
type = "mihomo"
file = "mihomo.yaml"
[provider.filters]
include = "^portable-"

[[provider]]
name = "portable-links"
type = "mihomo"
file = "mihomo.yaml"
[provider.filters]
include = "^portable-(ss|vmess|trojan|socks5)$"

[[provider]]
name = "chain"
type = "mihomo"
file = "mihomo.yaml"
dialer_proxy = "portable-ss"
[provider.filters]
include = "^chain-"
[provider.rename]
add_prefix = "via-"
replace = [{ old = "chain", new = "hop" }]

[[provider]]
name = "modern-mihomo"
type = "mihomo"
file = "mihomo.yaml"
[provider.filters]
include = "^modern-"

[[provider]]
name = "stash-native"
type = "stash"
file = "stash.yaml"

[[provider]]
name = "surge-native"
type = "surge"
file = "surge.conf"

[[provider]]
name = "subio-native"
type = "subio"
file = "self.toml"
[provider.rename]
add_prefix = "native-"

[[provider]]
name = "subio-json5"
type = "subio"
file = "nodes.json5"

[[provider]]
name = "subio-users"
type = "subio"
file = "multiuser.yml"

[[provider]]
name = "v2rayn-links"
type = "v2rayn"
file = "v2rayn.txt"

[[artifact]]
name = "mihomo.yaml"
type = "mihomo"
template = "mihomo.yaml"
providers = ["portable", "chain", "subio-native", "subio-json5"]
[artifact.options]
work = true

[[artifact]]
name = "raw-mihomo.yaml"
type = "mihomo"
providers = ["modern-mihomo"]

[[artifact]]
name = "stash.yaml"
type = "stash"
template = "stash.yaml"
providers = ["portable", "stash-native"]

[[artifact]]
name = "surge.conf"
type = "surge"
template = "surge.conf"
providers = ["portable", "surge-native"]

[[artifact]]
name = "dae.conf"
type = "dae"
template = "dae.conf"
providers = ["portable", "chain"]

[[artifact]]
name = "dae-subscription.txt"
type = "dae"
template = "dae_subscription.txt"
providers = ["portable", "chain"]

[[artifact]]
name = "v2rayn.txt"
type = "v2rayn"
template = "v2rayn.conf"
providers = ["portable-links", "v2rayn-links"]

[[artifact]]
name = "user-{user}.yaml"
type = "mihomo"
template = "mihomo.yaml"
providers = ["subio-users"]
users = ["alice", "bob"]
[artifact.options]
work = false

[[artifact]]
name = "single-user.yaml"
type = "mihomo"
template = "mihomo.yaml"
providers = ["subio-users"]
user = "alice"
[artifact.options]
work = false
