proxies:
  - name: portable-ss
    type: ss
    server: ss.example.test
    port: 8388
    cipher: aes-256-gcm
    password: example-password
    udp: true

  - name: portable-vmess
    type: vmess
    server: vmess.example.test
    port: 443
    uuid: 00000000-0000-0000-0000-000000000001
    cipher: auto
    tls: true
    sni: vmess.example.test

  - name: portable-trojan
    type: trojan
    server: trojan.example.test
    port: 443
    password: example-password
    sni: trojan.example.test

  - name: portable-http
    type: http
    server: http.example.test
    port: 8080
    username: example-user
    password: example-password

  - name: portable-socks5
    type: socks5
    server: socks.example.test
    port: 1080
    username: example-user
    password: example-password

  - name: chain-ss
    type: ss
    server: chain.example.test
    port: 8388
    cipher: chacha20-ietf-poly1305
    password: example-password

  - name: modern-vless-ws
    type: vless
    server: vless-ws.example.test
    port: 443
    uuid: 00000000-0000-0000-0000-000000000002
    network: ws
    tls: true
    sni: vless-ws.example.test
    client-fingerprint: chrome
    ws-opts:
      path: /example
      headers:
        Host: vless-ws.example.test

  - name: modern-vless-grpc
    type: vless
    server: vless-grpc.example.test
    port: 443
    uuid: 00000000-0000-0000-0000-000000000003
    network: grpc
    tls: true
    sni: vless-grpc.example.test
    grpc-opts:
      grpc-service-name: example

  - name: modern-vless-reality
    type: vless
    server: vless-reality.example.test
    port: 443
    uuid: 00000000-0000-0000-0000-000000000004
    tls: true
    sni: vless-reality.example.test
    client-fingerprint: chrome
    reality-opts:
      public-key: example-public-key
      short-id: abcd

  - name: modern-hysteria
    type: hysteria
    server: hysteria.example.test
    port: 8443
    up: 10 Mbps
    down: 50 Mbps
    auth-str: example-auth
    sni: hysteria.example.test

  - name: modern-anytls
    type: anytls
    server: anytls.example.test
    port: 443
    password: example-password
    sni: anytls.example.test

  - name: modern-tailscale
    type: tailscale
    auth-key: example-auth-key
    exit-node: example-exit-node
    ephemeral: true

  - name: modern-ss-uot
    type: ss
    server: ss-uot.example.test
    port: 443
    cipher: chacha20-ietf-poly1305
    password: example-password
    udp-over-tcp: true
    udp-over-tcp-version: 2
