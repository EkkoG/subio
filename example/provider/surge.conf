[Proxy]
surge-ss = ss, surge-ss.example.test, 8388, encrypt-method=aes-256-gcm, password=example-password, udp-relay=true
surge-vmess = vmess, surge-vmess.example.test, 443, username=00000000-0000-0000-0000-000000000021, tls=true, sni=surge-vmess.example.test
surge-trojan = trojan, surge-trojan.example.test, 443, password=example-password, sni=surge-trojan.example.test
surge-http = http, surge-http.example.test, 8080, username=example-user, password=example-password
surge-socks = socks5, surge-socks.example.test, 1080, username=example-user, password=example-password
surge-anytls = anytls, surge-anytls.example.test, 443, password=example-password, sni=surge-anytls.example.test
surge-direct = direct
surge-ssh = ssh, surge-ssh.example.test, 22, username=example-user, private-key=example-key
surge-wg = wireguard, section-name=ExampleWG

[Rule]
FINAL,DIRECT

[Keystore]
example-key = type = openssh-private-key, base64 = ZXhhbXBsZS1wcml2YXRlLWtleQ==

[WireGuard ExampleWG]
private-key = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
self-ip = 192.0.2.2
peer = (public-key = BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=, allowed-ips = "0.0.0.0/0", endpoint = surge-wg.example.test:51820)
